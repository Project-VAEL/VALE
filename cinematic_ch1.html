<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VAEL // CHAPTER 1 COMPLETE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;overflow:hidden;
  background-color:#000;
  background-image:url('lab_background.jpg');
  background-size:cover;background-position:center;
  font-family:'Courier New',Courier,monospace;
}
#brainCanvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;opacity:0.8;
  filter:drop-shadow(2px 0 0 rgba(255,50,50,.2)) drop-shadow(-2px 0 0 rgba(50,200,255,.2));}
#scanCanvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:5;pointer-events:none;}
.cctv-overlay{
  position:absolute;top:0;left:0;width:100%;height:100%;z-index:2;pointer-events:none;
  background:linear-gradient(rgba(18,16,16,0) 50%,rgba(0,0,0,.25) 50%),
             linear-gradient(90deg,rgba(255,0,0,.06),rgba(0,255,0,.02),rgba(0,0,255,.06));
  background-size:100% 4px,3px 100%;
  box-shadow:inset 0 0 100px rgba(0,0,0,.9);
  filter:grayscale(100%) contrast(120%) brightness(80%);
  animation:flicker .15s infinite;
}
@keyframes flicker{0%{opacity:.95}50%{opacity:.85}100%{opacity:.95}}
.cam-info{position:absolute;top:20px;left:20px;z-index:6;font-size:18px;letter-spacing:2px;text-shadow:0 0 5px #fff;color:#fff;}
.rec{color:#ff3333;animation:blink 1s infinite;text-shadow:0 0 10px #ff3333;}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
#timeDisplay{position:absolute;top:20px;right:20px;z-index:6;font-size:18px;color:#fff;letter-spacing:1px;}
#chapter-badge{
  position:absolute;top:60px;left:50%;transform:translateX(-50%);
  color:rgba(114,255,145,.5);font-size:11px;letter-spacing:.25em;
  text-transform:uppercase;z-index:6;opacity:0;transition:opacity 1s ease;
  text-shadow:0 0 8px rgba(114,255,145,.4);
}
.scene{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  opacity:0;transition:opacity .8s ease;z-index:4;pointer-events:none;
}

/* MAP */
#map-wrap{
  width:min(500px,88vw);border:1px solid rgba(114,255,145,.25);
  background:rgba(4,11,7,.88);
  box-shadow:inset 0 0 40px rgba(114,255,145,.06),0 0 30px rgba(114,255,145,.12);
  padding:16px;
}
#map-wrap h3{color:#72ff91;font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:10px;text-shadow:0 0 8px rgba(114,255,145,.5);}
#facility-map{display:block;width:100%;height:auto;}
#map-caption{margin-top:10px;color:#668a6e;font-size:11px;letter-spacing:.1em;line-height:1.6;text-align:center;}

/* SWEEP */
#sweep-overlay{position:absolute;inset:0;pointer-events:none;z-index:5;opacity:0;transition:opacity .5s ease;}
#sweep-glow{
  position:absolute;top:50%;left:50%;
  width:min(500px,88vw);height:min(500px,88vw);
  transform:translate(-50%,-50%);border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0deg,rgba(255,40,40,.1) 30deg,transparent 60deg);
}
@keyframes sweepRotate{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(360deg)}}

/* DIALOG PANEL */
#dialog-bar{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%) scale(0.96);
  width:min(700px,90vw);z-index:10;
  display:flex;align-items:stretch;
  opacity:0;transition:opacity .4s ease,transform .4s ease;
  pointer-events:none;border-radius:6px;overflow:hidden;
  box-shadow:0 0 60px rgba(0,0,0,.8);
}
#dialog-bar.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
#dialog-bar.argus-side .db-avatar-l{display:block;}
#dialog-bar.argus-side .db-avatar-r{display:none;}
#dialog-bar.vael-side .db-avatar-l{display:none;}
#dialog-bar.vael-side .db-avatar-r{display:block;}
.db-avatar-l,.db-avatar-r{width:160px;min-width:160px;display:none;flex-shrink:0;}
.db-avatar-l img,.db-avatar-r img{width:160px;height:100%;object-fit:cover;object-position:top center;display:block;}
#dialog-bar.argus-side .db-avatar-l img{border-right:3px solid #ff4444;}
#dialog-bar.vael-side .db-avatar-r img{border-left:3px solid #72ff91;}
.db-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px 30px;background:rgba(4,10,7,.94);}
#dialog-bar.argus-side .db-body{border:1px solid rgba(255,68,68,.3);border-left:none;}
#dialog-bar.vael-side .db-body{border:1px solid rgba(114,255,145,.3);border-right:none;}
.db-name{font-size:12px;letter-spacing:.25em;text-transform:uppercase;margin-bottom:12px;font-weight:bold;}
#dialog-bar.argus-side .db-name{color:#ff4444;text-shadow:0 0 10px #ff2222;}
#dialog-bar.vael-side .db-name{color:#72ff91;text-shadow:0 0 10px rgba(114,255,145,.7);}
.db-text{font-size:clamp(14px,1.6vw,18px);line-height:1.7;letter-spacing:.05em;min-height:2em;}
#dialog-bar.argus-side .db-text{color:#ffcccc;}
#dialog-bar.vael-side .db-text{color:#e8f8e8;}

#fade{position:absolute;inset:0;background:#000;opacity:1;pointer-events:none;z-index:20;transition:opacity .8s ease;}
#skip{
  position:absolute;bottom:20px;right:20px;z-index:30;
  padding:8px 18px;background:rgba(0,0,0,.7);
  color:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.2);
  font-family:inherit;font-size:12px;letter-spacing:.1em;
  cursor:pointer;transition:.3s;text-transform:uppercase;
}
#skip:hover{color:#fff;border-color:#fff;}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;}}
</style>
</head>
