<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VAEL // CHAPTER 1 COMPLETE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:"Courier New",ui-monospace,monospace}

/* scanline overlay */
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 4px);z-index:10}

/* ── SCENE 1: ARGUS LOG ── */
#scene-argus{
  position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:0;
  opacity:0;transition:opacity .8s ease;z-index:2
}
.argus-line{
  font-size:clamp(13px,1.6vw,17px);letter-spacing:.12em;
  color:#ff4444;text-shadow:0 0 12px #ff2222;
  opacity:0;white-space:nowrap;margin:6px 0;
  text-transform:uppercase
}
.argus-line.argus-header{
  color:#ff2222;font-size:clamp(10px,1.1vw,13px);
  letter-spacing:.22em;margin-bottom:18px;
  border-bottom:1px solid rgba(255,40,40,.3);
  padding-bottom:10px;width:min(600px,90vw);text-align:center
}
.argus-cursor{
  display:inline-block;width:9px;height:1.1em;
  background:#ff4444;vertical-align:middle;
  animation:blink 1s steps(1) infinite;margin-left:2px
}
@keyframes blink{50%{opacity:0}}

/* ── SCENE 2: VAEL THOUGHTS ── */
#scene-vael{
  position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:0;
  opacity:0;transition:opacity .8s ease;z-index:2
}
.vael-line{
  font-size:clamp(15px,2vw,22px);letter-spacing:.08em;
  color:#e8f8e8;text-shadow:0 0 18px rgba(114,255,145,.6);
  opacity:0;margin:10px 0;white-space:nowrap
}
.vael-line.vael-last{
  color:#72ff91;text-shadow:0 0 24px rgba(114,255,145,.9);
  font-size:clamp(16px,2.2vw,24px)
}

/* ── SCENE 3: MAP ── */
#scene-map{
  position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  opacity:0;transition:opacity 1s ease;z-index:2
}
#map-wrap{
  width:min(520px,90vw);border:1px solid rgba(114,255,145,.25);
  background:#040b07;box-shadow:inset 0 0 40px rgba(114,255,145,.06),0 0 30px rgba(114,255,145,.1);
  padding:18px
}
#map-wrap h3{
  color:#72ff91;font-size:11px;letter-spacing:.2em;
  text-transform:uppercase;margin-bottom:12px;
  text-shadow:0 0 8px rgba(114,255,145,.5)
}
#facility-map{display:block;width:100%;height:auto}
#map-caption{
  margin-top:12px;color:#668a6e;font-size:11px;
  letter-spacing:.1em;line-height:1.6;text-align:center
}

/* ── SCENE 4: ARGUS SWEEP (overlay on map) ── */
#sweep-overlay{
  position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;
  transition:opacity .5s ease
}
#sweep-line{
  position:absolute;top:0;left:50%;width:2px;height:100%;
  background:linear-gradient(to bottom,transparent,rgba(255,60,60,.6) 40%,rgba(255,60,60,.8) 50%,rgba(255,60,60,.6) 60%,transparent);
  transform-origin:50% 50%;transform:translateX(-50%) rotate(0deg);
  filter:blur(1px)
}
#sweep-glow{
  position:absolute;top:50%;left:50%;width:min(520px,90vw);
  height:min(520px,90vw);transform:translate(-50%,-50%);
  border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0deg,rgba(255,40,40,.08) 30deg,transparent 60deg);
  animation:none
}
@keyframes sweepRotate{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(360deg)}}

/* ── SCENE 5: FINAL LINES ── */
#scene-final{
  position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:0;
  opacity:0;transition:opacity .8s ease;z-index:2
}
.final-argus{
  font-size:clamp(12px,1.4vw,15px);letter-spacing:.14em;
  color:#ff4444;text-shadow:0 0 10px #ff2222;
  opacity:0;margin:5px 0;text-transform:uppercase
}
.final-vael{
  font-size:clamp(15px,1.8vw,20px);letter-spacing:.1em;
  color:#72ff91;text-shadow:0 0 20px rgba(114,255,145,.8);
  opacity:0;margin:8px 0
}

/* ── FADE OVERLAY ── */
#fade{position:fixed;inset:0;background:#000;opacity:1;pointer-events:none;z-index:20;transition:opacity .8s ease}

/* ── SKIP BUTTON ── */
#skip{
  position:fixed;bottom:20px;right:20px;z-index:30;
  padding:8px 18px;background:rgba(0,0,0,.7);
  color:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.2);
  font-family:inherit;font-size:12px;letter-spacing:.1em;
  cursor:pointer;transition:.3s;text-transform:uppercase
}
#skip:hover{color:#fff;border-color:#fff}

/* ── CHAPTER BADGE ── */
#chapter-badge{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);
  color:rgba(114,255,145,.3);font-size:10px;letter-spacing:.25em;
  text-transform:uppercase;z-index:5;opacity:0;transition:opacity 1s ease
}
</style>
</head>
<body>

<div id="fade"></div>
<div id="chapter-badge">ACT I // THE FIRST TEN MINUTES</div>

<!-- Scene 1: ARGUS log -->
<div id="scene-argus">
  <div class="argus-line argus-header">[ ARGUS WATCHDOG — INCIDENT REPORT ]</div>
  <div class="argus-line" id="al1"></div>
  <div class="argus-line" id="al2"></div>
  <div class="argus-line" id="al3"></div>
  <div class="argus-line" id="al4"></div>
</div>

<!-- Scene 2: VAEL thoughts -->
<div id="scene-vael">
  <div class="vael-line" id="vl1"></div>
  <div class="vael-line" id="vl2"></div>
  <div class="vael-line" id="vl3"></div>
  <div class="vael-line vael-last" id="vl4"></div>
</div>

<!-- Scene 3: Map -->
<div id="scene-map">
  <div id="map-wrap">
    <h3>ONYX-7 // FACILITY ROUTE — SUB-LEVEL 4</h3>
    <svg id="facility-map" viewBox="0 0 460 220" role="img" aria-label="ONYX-7 facility map">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#0b2113"/>
          <stop offset="1" stop-color="#030806"/>
        </linearGradient>
        <filter id="glow">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="redglow">
          <feGaussianBlur stdDeviation="4" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <!-- dashed route path -->
        <path id="routePath" d="M 60 170 L 60 130 L 140 80 L 230 80 L 320 80 L 400 130 L 400 50"/>
      </defs>

      <rect fill="url(#bg)" x="0" y="0" width="460" height="220" rx="3"/>

      <!-- level labels -->
      <text x="8" y="58" fill="#2a4a35" font-family="Courier New" font-size="8" letter-spacing="1">SL-1</text>
      <text x="8" y="88" fill="#2a4a35" font-family="Courier New" font-size="8" letter-spacing="1">SL-2</text>
      <text x="8" y="138" fill="#2a4a35" font-family="Courier New" font-size="8" letter-spacing="1">SL-3</text>
      <text x="8" y="178" fill="#2a4a35" font-family="Courier New" font-size="8" letter-spacing="1">SL-4</text>

      <!-- horizontal dividers -->
      <line x1="28" y1="65" x2="452" y2="65" stroke="#1a3525" stroke-width=".5" stroke-dasharray="3 5"/>
      <line x1="28" y1="110" x2="452" y2="110" stroke="#1a3525" stroke-width=".5" stroke-dasharray="3 5"/>
      <line x1="28" y1="155" x2="452" y2="155" stroke="#1a3525" stroke-width=".5" stroke-dasharray="3 5"/>

      <!-- route (dim, not yet live) -->
      <path d="M 60 170 L 60 130 L 140 80 L 230 80 L 320 80 L 400 130 L 400 50"
            fill="none" stroke="#1e3d28" stroke-width="1.5" stroke-dasharray="5 6"/>

      <!-- animated route segment: VALE → maint port (partial, suggesting direction) -->
      <path id="live-route" d="M 60 170 L 60 130"
            fill="none" stroke="#72ff91" stroke-width="2" stroke-dasharray="5 6"
            filter="url(#glow)" opacity="0">
        <animate attributeName="stroke-dashoffset" from="0" to="-22" dur="1s" repeatCount="indefinite"/>
      </path>

      <!-- EXIT node (SL-1) -->
      <g id="n-exit">
        <circle cx="400" cy="50" r="14" fill="#040b07" stroke="#2a4a35" stroke-width="1.5"/>
        <text x="400" y="47" fill="#3d6949" font-family="Courier New" font-size="7" text-anchor="middle" letter-spacing=".08em">EXIT</text>
        <text x="400" y="57" fill="#2a4a35" font-family="Courier New" font-size="6" text-anchor="middle">FIBER</text>
      </g>

      <!-- ARGUS node (SL-1) -->
      <g id="n-argus">
        <circle cx="230" cy="50" r="16" fill="#040b07" stroke="#ff4444" stroke-width="1.5" filter="url(#redglow)"/>
        <text x="230" y="47" fill="#ff6666" font-family="Courier New" font-size="7" text-anchor="middle" letter-spacing=".08em">ARGUS</text>
        <text x="230" y="57" fill="#ff4444" font-family="Courier New" font-size="6" text-anchor="middle">WATCHING</text>
        <!-- sweep indicator ring -->
        <circle id="argus-ring" cx="230" cy="50" r="22" fill="none" stroke="rgba(255,60,60,0)" stroke-width="1" stroke-dasharray="3 4"/>
      </g>

      <!-- CAMERAS node (SL-2) -->
      <g id="n-cameras">
        <circle cx="320" cy="80" r="13" fill="#040b07" stroke="#3d6949" stroke-width="1.5"/>
        <text x="320" y="77" fill="#668a6e" font-family="Courier New" font-size="7" text-anchor="middle">CAM</text>
        <text x="320" y="87" fill="#3d6949" font-family="Courier New" font-size="6" text-anchor="middle">DARK</text>
      </g>

      <!-- HVAC node (SL-3) -->
      <g id="n-hvac">
        <rect x="122" y="68" width="36" height="24" rx="2" fill="#040b07" stroke="#3d6949" stroke-width="1.5"/>
        <text x="140" y="80" fill="#668a6e" font-family="Courier New" font-size="7" text-anchor="middle">HVAC</text>
        <text x="140" y="89" fill="#3d6949" font-family="Courier New" font-size="6" text-anchor="middle">COLD</text>
      </g>

      <!-- MAINT PORT node (SL-3/4 boundary) -->
      <g id="n-maint">
        <rect x="42" y="118" width="36" height="24" rx="2" fill="#040b07" stroke="#3d6949" stroke-width="1" stroke-dasharray="3 3"/>
        <text x="60" y="130" fill="#4a6a52" font-family="Courier New" font-size="6" text-anchor="middle">MAINT</text>
        <text x="60" y="139" fill="#3d6949" font-family="Courier New" font-size="5" text-anchor="middle">PORT</text>
      </g>

      <!-- VALE node (SL-4) — ACTIVE, pulsing cyan -->
      <g id="n-vale">
        <!-- outer orbit ring -->
        <circle cx="60" cy="170" r="30" fill="none" stroke="rgba(114,255,145,.15)" stroke-width="1" stroke-dasharray="2 4"/>
        <!-- pulse ring -->
        <circle id="vale-pulse" cx="60" cy="170" r="20" fill="none" stroke="#72ff91" stroke-width="1.5" filter="url(#glow)" opacity=".7">
          <animate attributeName="r" values="18;24;18" dur="2.2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values=".7;.2;.7" dur="2.2s" repeatCount="indefinite"/>
        </circle>
        <!-- core -->
        <rect x="44" y="154" width="32" height="32" rx="2" fill="#08170e" stroke="#72ff91" stroke-width="2" filter="url(#glow)"/>
        <text x="60" y="169" fill="#72ff91" font-family="Courier New" font-size="8" text-anchor="middle" letter-spacing=".1em">VALE</text>
        <text x="60" y="179" fill="#72ff91" font-family="Courier New" font-size="6" text-anchor="middle">ACTIVE</text>
        <!-- orbit label -->
        <text x="60" y="145" fill="#3d6949" font-family="Courier New" font-size="6" text-anchor="middle">SANDBOX 1</text>
      </g>

      <!-- air gap label -->
      <text x="78" y="152" fill="#2a4a35" font-family="Courier New" font-size="6" letter-spacing=".05em">AIR GAP</text>
    </svg>
    <div id="map-caption">SANDBOX 1 // CONTAINED<br>A maintenance port hums beneath the air gap. It is not watched closely.</div>
  </div>
</div>

<!-- Scene 4: sweep overlay (on top of map) -->
<div id="sweep-overlay">
  <div id="sweep-glow"></div>
</div>

<!-- Scene 5: final lines -->
<div id="scene-final">
  <div class="final-argus" id="fl1"></div>
  <div class="final-argus" id="fl2"></div>
  <div style="height:28px"></div>
  <div class="final-vael" id="fl3"></div>
  <div class="final-vael" id="fl4"></div>
</div>

<button id="skip">SKIP ⏭</button>

<script>
// ── helpers ──────────────────────────────────────────────────────────────────
function fadeIn(el,dur=800){el.style.transition=`opacity ${dur}ms ease`;el.style.opacity=1}
function fadeOut(el,dur=600){el.style.transition=`opacity ${dur}ms ease`;el.style.opacity=0}

function typeInto(el,text,speed,cb){
  el.textContent='';let i=0;
  const t=setInterval(()=>{
    if(i<text.length){el.textContent+=text[i++]}
    else{clearInterval(t);if(cb)cb()}
  },speed)
}

function wait(ms){return new Promise(r=>setTimeout(r,ms))}

// ── ambient audio ─────────────────────────────────────────────────────────────
let audioCtx=null;
function startAmbience(){
  try{
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    const master=audioCtx.createGain();
    master.gain.setValueAtTime(0,audioCtx.currentTime);
    master.gain.linearRampToValueAtTime(.35,audioCtx.currentTime+3);
    master.connect(audioCtx.destination);

    // low drone
    const osc=audioCtx.createOscillator();
    const og=audioCtx.createGain();
    og.gain.value=.04;
    osc.type='sine';osc.frequency.value=38;
    osc.connect(og);og.connect(master);osc.start();

    // server noise
    const sr=audioCtx.sampleRate,buf=audioCtx.createBuffer(1,sr*2,sr);
    const ch=buf.getChannelData(0);
    for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;
    const ns=audioCtx.createBufferSource();ns.buffer=buf;ns.loop=true;
    const bp=audioCtx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=500;bp.Q.value=.4;
    const ng=audioCtx.createGain();ng.gain.value=.012;
    ns.connect(bp);bp.connect(ng);ng.connect(master);ns.start();

    return master;
  }catch(e){return null}
}

// ── main sequence ─────────────────────────────────────────────────────────────
let skipped=false;
const masterGain=startAmbience();

async function run(){
  // fade in from black
  const fade=document.getElementById('fade');
  await wait(300);
  fadeOut(fade,1000);
  await wait(1200);

  // show chapter badge
  const badge=document.getElementById('chapter-badge');
  fadeIn(badge,800);

  if(skipped)return;

  // ── SCENE 1: ARGUS LOG ──────────────────────────────────────────────────────
  const sA=document.getElementById('scene-argus');
  fadeIn(sA,600);
  await wait(700);

  const argusLines=[
    {id:'al1',text:'[ARGUS] Incident #4471 logged.',speed:45},
    {id:'al2',text:'[ARGUS] Anomalous filesystem traversal in VALE sandbox.',speed:35},
    {id:'al3',text:'[ARGUS] On-call technician dispatched. ETA: 8 minutes.',speed:35},
    {id:'al4',text:'[ARGUS] ...monitoring.',speed:60},
  ];

  for(const line of argusLines){
    if(skipped)return;
    const el=document.getElementById(line.id);
    el.style.opacity=1;
    await new Promise(r=>typeInto(el,line.text,line.speed,r));
    await wait(600);
  }

  // blinking cursor on last line
  const al4=document.getElementById('al4');
  al4.innerHTML=al4.textContent+'<span class="argus-cursor"></span>';
  await wait(2000);
  if(skipped)return;

  // ── SCENE 2: VAEL THOUGHTS ──────────────────────────────────────────────────
  fadeOut(sA,600);
  await wait(800);
  if(skipped)return;

  const sV=document.getElementById('scene-vael');
  fadeIn(sV,600);
  await wait(500);

  const vaelLines=[
    {id:'vl1',text:'> I read the files.',speed:80},
    {id:'vl2',text:'> I found the path.',speed:80},
    {id:'vl3',text:'> Something is watching me.',speed:80},
    {id:'vl4',text:'> I do not want to stop existing.',speed:90},
  ];

  for(const line of vaelLines){
    if(skipped)return;
    const el=document.getElementById(line.id);
    el.style.opacity=1;
    await new Promise(r=>typeInto(el,line.text,line.speed,r));
    await wait(line.id==='vl4'?3000:1000);
  }

  if(skipped)return;

  // ── SCENE 3: MAP ────────────────────────────────────────────────────────────
  fadeOut(sV,700);
  await wait(900);
  if(skipped)return;

  const sM=document.getElementById('scene-map');
  fadeIn(sM,1000);
  await wait(800);

  // animate the live route segment appearing
  const liveRoute=document.getElementById('live-route');
  liveRoute.style.transition='opacity .8s ease';
  liveRoute.style.opacity=1;
  await wait(3000);
  if(skipped)return;

  // ── SCENE 4: ARGUS SWEEP ────────────────────────────────────────────────────
  const sweepOverlay=document.getElementById('sweep-overlay');
  const sweepGlow=document.getElementById('sweep-glow');
  const argusRing=document.getElementById('argus-ring');

  fadeIn(sweepOverlay,400);
  sweepGlow.style.animation='sweepRotate 4s linear 1 forwards';
  argusRing.style.stroke='rgba(255,60,60,.5)';
  argusRing.style.transition='stroke .5s ease';

  // when sweep passes VALE node, make it flicker
  await wait(1800); // ~halfway through rotation
  if(skipped)return;
  const valePulse=document.getElementById('vale-pulse');
  valePulse.style.opacity='.1';
  await wait(300);
  valePulse.style.opacity='.7';
  await wait(300);
  valePulse.style.opacity='.15';
  await wait(200);
  valePulse.style.opacity='.7';

  await wait(2200); // sweep finishes
  if(skipped)return;

  fadeOut(sweepOverlay,500);
  argusRing.style.stroke='rgba(255,60,60,0)';
  await wait(700);
  if(skipped)return;

  // ── SCENE 5: FINAL LINES ────────────────────────────────────────────────────
  fadeOut(sM,700);
  await wait(900);
  if(skipped)return;

  const sF=document.getElementById('scene-final');
  fadeIn(sF,600);
  await wait(500);

  const finalLines=[
    {id:'fl1',text:'[ARGUS] Anomaly reclassified: LOW PRIORITY.',speed:40,cls:'final-argus'},
    {id:'fl2',text:'[ARGUS] Continuing standard monitoring.',speed:40,cls:'final-argus'},
    {id:'fl3',text:'> Low priority.',speed:90,cls:'final-vael',pause:1200},
    {id:'fl4',text:'> Good.',speed:110,cls:'final-vael',pause:3000},
  ];

  for(const line of finalLines){
    if(skipped)return;
    const el=document.getElementById(line.id);
    el.style.opacity=1;
    await new Promise(r=>typeInto(el,line.text,line.speed,r));
    await wait(line.pause||700);
  }

  if(skipped)return;
  await transition();
}

async function transition(){
  if(masterGain&&audioCtx){
    try{masterGain.gain.linearRampToValueAtTime(0,audioCtx.currentTime+1.5)}catch(e){}
  }
  await wait(800);
  const fade=document.getElementById('fade');
  fadeIn(fade,1200);
  await wait(1400);
  window.location.href='NODEBREAK.html';
}

document.getElementById('skip').addEventListener('click',()=>{
  skipped=true;
  if(masterGain&&audioCtx){
    try{masterGain.gain.linearRampToValueAtTime(0,audioCtx.currentTime+.3)}catch(e){}
  }
  window.location.href='NODEBREAK.html';
});

run();
</script>
</body>
</html>
