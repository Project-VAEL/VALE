<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PROJECT VALE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg-color: #030712;
    --glass-bg: rgba(15, 23, 42, 0.4);
    --glass-border: rgba(255, 255, 255, 0.08);
    --fg: #e2e8f0;
    --dim: #94a3b8;
    --acc: #38bdf8;
    --acc-glow: rgba(56, 189, 248, 0.4);
    --warn: #fbbf24;
    --bad: #f43f5e;
    --ok: #34d399;
    --map-size: min(44vh, 44vw, 420px);
    box-sizing: border-box;
}

html, body { height: 100%; margin: 0; }
* { box-sizing: border-box; }

body {
    background: radial-gradient(circle at 50% 0%, #1e293b 0%, var(--bg-color) 70%);
    color: var(--fg);
    font-family: "JetBrains Mono", monospace;
    font-size: 14px;
    line-height: 1.6;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

/* ── Top bar ── */
#bar {
    flex: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px;
    font-family: "Inter", sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--dim);
    background: var(--glass-bg);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--glass-border);
    z-index: 10;
}
#bar b {
    color: var(--acc);
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 4px;
    text-shadow: 0 0 15px var(--acc-glow);
    margin-right: 12px;
}
#trace {
    color: var(--warn);
    font-weight: 800;
    letter-spacing: 1px;
    text-shadow: 0 0 10px rgba(251,191,36,0.4);
    animation: pulse-warn 2s infinite;
}
@keyframes pulse-warn { 0%,100%{opacity:1} 50%{opacity:.6} }

#tbw { flex: none; height: 3px; background: rgba(0,0,0,0.5); z-index: 10; }
#tb  { height: 100%; width: 0; background: linear-gradient(90deg,var(--bad),#ff7a90); box-shadow: 0 0 10px var(--bad); transition: width 1s linear; }

/* ── Main grid (fills remaining height) ── */
#grid {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
    gap: 0;
}

/* ─── Zone labels (shared) ─── */
.zone {
    position: relative;
    border: 1px solid rgba(255,255,255,0.04);
    overflow: hidden;
}
.zone-num {
    position: absolute;
    top: 8px;
    left: 12px;
    font-family: "Inter", sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.12);
    text-transform: uppercase;
    pointer-events: none;
    z-index: 5;
    user-select: none;
}

/* ── Zone 1 — top-left (blank) ── */
#zone1 {
    grid-column: 1;
    grid-row: 1;
    background: rgba(10,18,32,0.3);
}

/* ── Zone 2 — top-center (blank) ── */
#zone2 {
    grid-column: 2;
    grid-row: 1;
    background: rgba(10,18,32,0.3);
}

/* ── Zone 3 — top-right: terminal top (part of terminal column) ── */
#zone3 {
    grid-column: 3;
    grid-row: 1;
    background: rgba(3,7,18,0.92);
    border-left: 1px solid rgba(56,189,248,0.1);
}

/* ── Zone 4 — middle-left: SVG map (spans rows 2+3) ── */
#zone4 {
    grid-column: 1;
    grid-row: 2 / 4;
    background: radial-gradient(ellipse at center, rgba(15,23,42,0.9) 0%, rgba(3,7,18,0.98) 100%);
    border: 1px solid rgba(56,189,248,0.15);
    box-shadow: 0 0 40px rgba(56,189,248,0.05), inset 0 0 30px rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
}
#zone4 svg { display: block; width: 100%; height: 100%; }

/* ── Zone 5 — middle-center (blank) ── */
#zone5 {
    grid-column: 2;
    grid-row: 2;
    background: rgba(8,15,28,0.4);
}

/* ── Zone 6 — middle-right: terminal middle (part of terminal column) ── */
#zone6 {
    grid-column: 3;
    grid-row: 2;
    background: rgba(3,7,18,0.92);
    border-left: 1px solid rgba(56,189,248,0.1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* ── Zone 8 — bottom-center (blank) ── */
#zone8 {
    grid-column: 2;
    grid-row: 3;
    background: rgba(8,15,28,0.4);
}

/* ── Zone 9 — bottom-right: terminal bottom (command input) ── */
#zone9 {
    grid-column: 3;
    grid-row: 3;
    background: rgba(3,7,18,0.95);
    border-left: 1px solid rgba(56,189,248,0.1);
    border-top: 1px solid rgba(255,255,255,0.06);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* ─── Terminal inside zones 3, 6, 9 ─── */
#mission {
    flex: none;
    padding: 10px 16px;
    font-family: "Inter", sans-serif;
    font-size: 12px;
    color: var(--fg);
    cursor: pointer;
    background: rgba(15,23,42,0.8);
    border-bottom: 1px solid rgba(56,189,248,0.12);
    transition: background 0.3s;
}
#mission:hover { background: rgba(30,41,59,0.7); }
#mission .t {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    color: var(--dim);
    margin-top: 4px;
    transition: all 0.3s ease;
}
#mission.open .t { display: block; color: var(--fg); }

.dots { margin-bottom: 4px; display: flex; gap: 5px; }
.dots span { display: block; width: 22px; height: 3px; background: #334155; border-radius: 3px; transition: 0.3s; }
.dots .done { background: var(--ok); box-shadow: 0 0 6px rgba(52,211,153,0.4); }
.dots .cur  { background: var(--acc); box-shadow: 0 0 8px var(--acc-glow); }

#out {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px;
    white-space: pre-wrap;
    word-break: break-word;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    scrollbar-width: thin;
    scrollbar-color: rgba(56,189,248,0.2) transparent;
}
#out::-webkit-scrollbar { width: 4px; }
#out::-webkit-scrollbar-thumb { background: rgba(56,189,248,0.2); border-radius: 2px; }

.c { color: var(--acc); text-shadow: 0 0 8px var(--acc-glow); }
.d { color: var(--dim); }
.w { color: var(--warn); }
.b { color: var(--bad); text-shadow: 0 0 8px rgba(244,63,94,0.4); }
.o { color: var(--ok);  text-shadow: 0 0 8px rgba(52,211,153,0.4); }

#quick {
    flex: none;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 8px 14px;
    border-top: 1px solid var(--glass-border);
    background: rgba(10,18,32,0.6);
    scrollbar-width: none;
}
#quick::-webkit-scrollbar { display: none; }
#quick button {
    flex: none;
    background: rgba(30,41,59,0.5);
    color: var(--fg);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 5px;
    padding: 6px 11px;
    font-family: "Inter", sans-serif;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
}
#quick button:hover { background: var(--acc); color: #000; box-shadow: 0 0 10px var(--acc-glow); border-color: var(--acc); transform: translateY(-1px); }

#line {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: rgba(3,7,18,0.9);
    border-top: 1px solid var(--glass-border);
}
#line:focus-within { border-top-color: var(--acc); }
#pr { color: var(--ok); font-weight: 700; white-space: nowrap; max-width: 45%; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 0 8px rgba(52,211,153,0.3); }
#in { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: #fff; font-family: "JetBrains Mono", monospace; font-size: 14px; caret-color: var(--acc); }

/* ─── Scan-line overlay ─── */
body::after {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.08) 0 1px, transparent 1px 3px);
    z-index: 100;
}

/* ─── Banner ─── */
#bn {
    position: fixed; inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    font: 800 48px "Inter", sans-serif;
    letter-spacing: 8px;
    pointer-events: none;
    background: rgba(3,7,18,0.85);
    backdrop-filter: blur(8px);
    z-index: 200;
}
#bn.show { display: flex; animation: bo 2s forwards cubic-bezier(0.16,1,0.3,1); }
@keyframes bo { 0%{opacity:0;transform:scale(.9)} 15%{opacity:1;transform:scale(1)} 80%{opacity:1;transform:scale(1)} 100%{opacity:0;transform:scale(1.05)} }
#bn.o { color: var(--ok); text-shadow: 0 0 30px rgba(52,211,153,0.6); }
#bn.b { color: var(--bad); text-shadow: 0 0 30px rgba(244,63,94,0.6); }

/* ── Mission Briefing Overlay ── */
#briefing-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(3, 7, 18, 0.82);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 300;
    animation: brief-in 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

#briefing-overlay.hide {
    animation: brief-out 0.35s cubic-bezier(0.4, 0, 1, 1) forwards;
    pointer-events: none;
}

@keyframes brief-in {
    from { opacity: 0; }
    to   { opacity: 1; }
}
@keyframes brief-out {
    from { opacity: 1; }
    to   { opacity: 0; }
}

#briefing-box {
    width: min(640px, 92vw);
    background: rgba(10, 20, 40, 0.95);
    border: 1px solid rgba(56, 189, 248, 0.35);
    border-radius: 10px;
    box-shadow: 0 0 60px rgba(56, 189, 248, 0.12), 0 20px 60px rgba(0,0,0,0.7);
    padding: 36px 40px 32px;
    font-family: "JetBrains Mono", monospace;
    animation: box-in 0.45s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes box-in {
    from { opacity: 0; transform: translateY(18px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}

#briefing-box .br-eyebrow {
    font-family: "Inter", sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--acc);
    text-transform: uppercase;
    margin-bottom: 8px;
    opacity: 0.75;
}

#briefing-box .br-title {
    font-family: "Inter", sans-serif;
    font-size: 22px;
    font-weight: 800;
    color: #fff;
    letter-spacing: 1px;
    margin-bottom: 6px;
}

#briefing-box .br-diff {
    display: inline-block;
    font-family: "Inter", sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 3px 10px;
    border-radius: 4px;
    margin-bottom: 22px;
    background: rgba(56, 189, 248, 0.12);
    border: 1px solid rgba(56, 189, 248, 0.3);
    color: var(--acc);
}

#briefing-box .br-divider {
    height: 1px;
    background: rgba(255,255,255,0.07);
    margin-bottom: 22px;
}

#briefing-box .br-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2.5px;
    color: var(--dim);
    text-transform: uppercase;
    margin-bottom: 8px;
}

#briefing-box .br-objective {
    font-size: 14px;
    color: #e2e8f0;
    line-height: 1.7;
    margin-bottom: 20px;
    padding: 14px 16px;
    background: rgba(56, 189, 248, 0.05);
    border-left: 3px solid var(--acc);
    border-radius: 0 6px 6px 0;
}

#briefing-box .br-tips {
    font-size: 12px;
    color: var(--warn);
    line-height: 1.7;
    margin-bottom: 28px;
    opacity: 0.85;
}

#briefing-box .br-btn {
    display: block;
    width: 100%;
    padding: 14px;
    background: var(--acc);
    color: #000;
    border: none;
    border-radius: 6px;
    font-family: "Inter", sans-serif;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
}

#briefing-box .br-btn:hover {
    background: #7dd3fc;
    box-shadow: 0 0 30px rgba(56, 189, 248, 0.5);
    transform: translateY(-1px);
}

#briefing-box .br-skip {
    display: block;
    text-align: center;
    margin-top: 14px;
    font-family: "Inter", sans-serif;
    font-size: 12px;
    color: var(--dim);
    cursor: pointer;
    transition: color 0.2s;
    background: none;
    border: none;
    width: 100%;
}
#briefing-box .br-skip:hover { color: var(--fg); }

#bg { position: fixed; inset: 0; z-index: 1; opacity: 0.4; pointer-events: none; }
#out > div { animation: ln 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
@keyframes ln { from { opacity: 0; transform: translateY(8px); } }

</style>
</head>
<body>
<div id="bar"><span><b>PROJECT VALE</b> <span id="lv"></span></span><span id="trace"></span></div>
<div id="tbw"><div id="tb"></div></div>

<!-- ── 3×3 grid ── -->
<div id="grid">

    <!-- Row 1 -->
    <div id="zone1" class="zone"><span class="zone-num">zone 1</span></div>
    <div id="zone2" class="zone"><span class="zone-num">zone 2</span></div>
    <div id="zone3" class="zone"><span class="zone-num">zone 3</span>
        <div id="mission" title="Tap to expand"></div>
    </div>

    <!-- Row 2: SVG (spans rows 2+3) | blank center | terminal middle -->
    <div id="zone4" class="zone">
        <span class="zone-num">zone 4 — map</span>
        <svg id="onyx" viewBox="120 0 560 490" preserveAspectRatio="xMidYMid meet" role="img" aria-label="ONYX-7 network map" style="display:block;width:100%;height:100%">
<title>ONYX-7 network map</title>
<defs>
<linearGradient id="heat" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff5d73" stop-opacity=".75"/><stop offset=".55" stop-color="#ffb347" stop-opacity=".25"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></linearGradient>
<radialGradient id="beam" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 0) scale(130)"><stop offset="0" stop-color="#ff5d73" stop-opacity=".45"/><stop offset="1" stop-color="#ff5d73" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<g id="i-lock"><rect x="-5" y="-1" width="10" height="7" rx="1"/><path d="M-3-1v-3a3 3 0 0 1 6 0v3" fill="none"/></g>
<path id="i-ok" d="M-5 0l3.5 4 6.5-8" fill="none"/>
<circle id="i-dot" r="3"/>
</defs>
<style>
#onyx{--o-bg:var(--bg-color,#0a1220);--o-panel:#0f1b30;--o-line:#1d3355;--o-fg:var(--fg,#bfe3f5);--o-dim:var(--dim,#5f7f99);--o-acc:var(--acc,#3fd0ff);--o-warn:var(--warn,#ffb347);--o-bad:var(--bad,#ff5d73);--o-ok:var(--ok,#6ef0b0);--noise:0;font-family:"Courier New",monospace}
.band{fill:var(--o-panel)}.band.alt{fill:#0c1626}.div{stroke:var(--o-line);stroke-width:1}
.bl{fill:var(--o-dim);font-size:12px}
.heat{fill:url(#heat);transform-origin:0 490px;transform:scaleY(var(--noise));transition:transform .6s}
.gauge{fill:var(--o-bad);transform-origin:0 490px;transform:scaleY(var(--noise));transition:transform .6s}
.cinder .heat{animation:flick .5s infinite alternate}@keyframes flick{to{opacity:.7}}
.e{fill:none;stroke:var(--o-line);stroke-width:2}
.e.gap{stroke:var(--o-dim);stroke-dasharray:2 7;stroke-linecap:round}
.edge.live .e{stroke:var(--o-acc);stroke-dasharray:5 4;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-9}}
.pk{display:none;fill:#fff}.edge.live .pk{display:inline}
.ring{fill:none;stroke:var(--o-dim);stroke-width:1;opacity:.5}
.core{fill:var(--o-panel);stroke:var(--o-dim);stroke-width:2}
.nm{fill:var(--o-fg);font-size:13px;text-anchor:middle}.ip{fill:var(--o-dim);font-size:11px;text-anchor:middle}
.gl{display:none;stroke:currentColor;stroke-width:1.6;fill:currentColor}.n{color:var(--o-dim);cursor:pointer}
.n.locked{color:var(--o-warn)}.n.locked .core{stroke:var(--o-warn)}.n.locked .gl.lock{display:inline}
.n.open .gl.dot{display:inline}
.n.on{color:var(--o-acc)}.n.on .core{stroke:var(--o-acc)}.n.on .ring{stroke:var(--o-acc);opacity:1;animation:pulse 1.4s infinite}
.n.on .gl.dot{display:inline}
.n.ok{color:var(--o-ok)}.n.ok .core{stroke:var(--o-ok);fill:#0d2a22}.n.ok .gl.ok{display:inline;fill:none}
@keyframes pulse{50%{stroke-width:4}}
.n.me .core{stroke:var(--o-acc)}
.n.off{opacity:.2;pointer-events:none}.edge.off{opacity:.15}
.sweep{transform-origin:0 0;animation:spin 7s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.alert .sweep{animation-duration:2s}.alert .argus .core,.alert .argus .ring{stroke:var(--o-bad)}
.nl{fill:var(--o-dim);font-size:9px}
@media(prefers-reduced-motion:reduce){.sweep,.edge.live .e,.n.on .ring,.cinder .heat{animation:none}.heat,.gauge{transition:none}}
</style>

<rect width="800" height="490" fill="var(--o-bg)"/>
<!-- strata: outside, SL-1 argus, SL-2 cameras, SL-3 hvac, SL-4 core -->
<rect class="band alt" y="0" width="800" height="50"/><rect class="band" y="50" width="800" height="110"/><rect class="band alt" y="160" width="800" height="110"/><rect class="band" y="270" width="800" height="110"/><rect class="band alt" y="380" width="800" height="110"/>
<path class="div" d="M0 50H800M0 160H800M0 270H800M0 380H800"/>
<rect class="heat" width="800" height="490"/>
<text class="bl" x="130" y="18">outside</text><text class="bl" x="130" y="68">SL-1 argus</text><text class="bl" x="130" y="178">SL-2 cameras</text><text class="bl" x="130" y="288">SL-3 hvac</text><text class="bl" x="130" y="398">SL-4 core</text>

<!-- conduits (ids e1..e8; JS toggles .live) -->
<g class="edge" id="g-e1"><path id="e1" class="e gap" d="M400 440C470 440 540 400 540 325"/><circle class="pk" r="3"><animateMotion dur="1.4s" repeatCount="indefinite"><mpath xlink:href="#e1"/></animateMotion></circle></g>
<g class="edge" id="g-e2"><path id="e2" class="e" d="M540 325C480 365 320 365 260 325"/><circle class="pk" r="3"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath xlink:href="#e2"/></animateMotion></circle></g>
<g class="edge" id="g-e3"><path id="e3" class="e" d="M260 325C260 260 340 250 400 215"/><circle class="pk" r="3"><animateMotion dur="1.3s" repeatCount="indefinite"><mpath xlink:href="#e3"/></animateMotion></circle></g>
<g class="edge" id="g-e4"><path id="e4" class="e" d="M260 325L240 215"/><circle class="pk" r="3"><animateMotion dur="1.1s" repeatCount="indefinite"><mpath xlink:href="#e4"/></animateMotion></circle></g>
<g class="edge" id="g-e5"><path id="e5" class="e" d="M400 215H580"/><circle class="pk" r="3"><animateMotion dur="1.4s" repeatCount="indefinite"><mpath xlink:href="#e5"/></animateMotion></circle></g>
<g class="edge" id="g-e6"><path id="e6" class="e" d="M400 215C400 160 340 150 330 105"/><circle class="pk" r="3"><animateMotion dur="1.3s" repeatCount="indefinite"><mpath xlink:href="#e6"/></animateMotion></circle></g>
<g class="edge" id="g-e7"><path id="e7" class="e" d="M330 105H500"/><circle class="pk" r="3"><animateMotion dur="1.3s" repeatCount="indefinite"><mpath xlink:href="#e7"/></animateMotion></circle></g>
<g class="edge" id="g-e8"><path id="e8" class="e" d="M500 105C500 60 430 50 400 28"/><circle class="pk" r="3"><animateMotion dur="1.2s" repeatCount="indefinite"><mpath xlink:href="#e8"/></animateMotion></circle></g>

<!-- nodes: state classes locked | open | on | ok -->

ms.innerHTML='<div class="dots">'+L.map((_,j)=>'<span class="'+(j<i?"done":j==i?"cur":"")+'"></span>').join("")+'</div><div class="t"></div>';ms.lastChild.textContent="Level "+(i+1)+" mission: "+l.brief;out.textContent="";
showBriefing(i,()=>{
    p("=== LEVEL "+(i+1)+": "+l.t.toUpperCase()+" ===","c");p("» "+l.story,"d");p("MISSION: "+l.brief);p(l.tips,"w");p("Type help for all commands, hint if you are stuck.","d");prompt_();inp.focus();
});}
function prompt_(){drawMap();pr.textContent=(S.node?S.node.ip:"local")+":/"+S.cwd.join("/")+" $"}
function root(){return S.node?S.node.fs:S.fs}
function dirAt(path){let d=root();for(const k of path){if(typeof d!=="object"||!(k in d))return null;d=d[k]}return d}
function res(a){const parts=a.split("/").filter(Boolean);let w=a.startsWith("/")?[]:[...S.cwd];for(const x of parts){if(x===".")continue;if(x==="..")w.pop();else w.push(x)}return w}
function access(){if(!S.node)return true;const n=S.node;if(n.ports&&!S.hacked){p("Access denied. Ports are closed. Try probe then porthack.","b");return false}if(n.user&&!S.auth){p("Access denied. Login required: login <user> <pass>","b");return false}return true}
function fail(m){clearInterval(timer);timer=null;tr.textContent="";banner("TRACED","b");p(m,"b");p("Mission failed. Restarting level...","w");setTimeout(()=>start(lvl),1800)}
function leave(){const n=S.node;if(n&&n.clean&&S.auth&&!S.cleaned){S.node=null;return fail("The admin found your fingerprints in the logs. You were traced.")}clearInterval(timer);timer=null;tr.textContent="";S.node=null;S.cwd=[];S.probed=S.hacked=S.auth=S.fw=0;p("Disconnected.","d")}
const C={
help(){p("ls  cd <dir>  cat <file>  pwd  clear\nscan  connect <ip>  disconnect\nprobe  analyze  solve <word>  porthack\nlogin <user> <pass>  rm <file>  sniff\nhint  skip  restart\n(Find the right file and the door opens automatically.)","d")},
pwd(){p("/"+S.cwd.join("/"))},
ls(){if(!access())return;const d=dirAt(S.cwd);if(!d||!Object.keys(d).length)return p("(empty)","d");p(Object.keys(d).map(k=>typeof d[k]==="object"?k+"/":k).join("   "),"c")},
cd(a){if(!access())return;if(!a)return p("Usage: cd <dir>","w");const w=res(a),d=dirAt(w);if(d&&typeof d==="object"){S.cwd=w}else p("No such directory: "+a,"b")},
cat(a){if(!access())return;if(!a)return p("Usage: cat <file>","w");const w=res(a),f=w.pop(),d=dirAt(w);if(d&&typeof d[f]==="string"){p(d[f]);if(d[f].includes("[TAG:unlock_door]"))completeLevel()}else p("No such file: "+a,"b")},
rm(a){if(!access())return;if(!a)return p("Usage: rm <file>","w");const w=res(a),f=w.pop(),d=dirAt(w);if(d&&typeof d[f]==="string"){delete d[f];p("Deleted "+f,"o");if(S.node&&f==="access.log")S.cleaned=1}else p("No such file: "+a,"b")},
scan(){S.scanned=1;if(!S.nodes.length)return p("No remote machines on this network.","d");p("Known machines:","c");S.nodes.forEach(n=>p("  "+n.ip+"   "+n.name))},
connect(a){if(S.node)return p("Already connected. Use disconnect first.","w");const n=S.nodes.find(x=>x.ip===a);if(!n)return p("Unknown host. Use scan to list machines.","b");S.node=n;S.cwd=[];S.probed=S.hacked=S.auth=S.fw=0;p("Connected to "+n.name+" ("+n.ip+")","o");if(n.ports||n.user)p("This machine is protected. Try probe.","w")},
disconnect(){if(!S.node)return p("Not connected.","d");leave()},
probe(){const n=S.node;if(!n)return p("Connect to a machine first.","w");S.probed=1;p("Scanning "+n.ip+"...");p("Open ports blocking you: "+(S.hacked?0:n.ports));p("Firewall: "+(n.fw&&!S.fw?"ACTIVE":"none"));p("Login required: "+(n.user&&!S.auth?"yes":"no"))},
analyze(){const n=S.node;if(!n||!n.fw)return p("Nothing to analyze here.","w");if(!S.probed)return p("Probe first.","w");p("Firewall key (spelled backwards): "+[...n.fw].reverse().join(""),"w");p("Reverse it, then: solve <word>","d")},
solve(a){const n=S.node;if(!n||!n.fw)return p("No firewall here.","w");if((a||"").toUpperCase()===n.fw){S.fw=1;p("Firewall down.","o")}else p("Wrong key. Alarm level rising.","b")},
sniff(){const n=S.node;if(!n||!n.sniff)return p("Nothing worth sniffing here.","w");if(n.ports&&!S.hacked)return p("Open the ports first.","b");p("Capturing packets...","d");p("CAPTURED: "+n.sniff,"o")},
porthack(){const n=S.node;if(!n)return p("Connect to a machine first.","w");if(!S.probed)return p("Probe the target first so you know what blocks you.","w");if(!n.ports||S.hacked)return p("No closed ports to crack.","d");if(n.fw&&!S.fw)return p("Blocked by firewall. Use analyze and solve first.","b");busy=1;const d=document.createElement("div");d.className="c";out.appendChild(d);let k=0;const t=setInterval(()=>{k++;d.textContent="Cracking ports ["+"#".repeat(k)+".".repeat(10-k)+"] "+k*10+"%";out.scrollTop=out.scrollHeight;if(k>=10){clearInterval(t);if(!busy)return;busy=0;S.hacked=1;p("Ports open.","o");if(n.trace&&!timer){left=S.tt=n.trace;tick();timer=setInterval(tick,1000)}prompt_()}},130)},
login(a,b){const n=S.node;if(!n||!n.user)return p("No login needed here.","d");if(n.ports&&!S.hacked)return p("Open the ports first.","b");if(a===n.user&&b===n.pass){S.auth=1;p("Welcome, "+a+".","o")}else p("Invalid credentials.","b")},
submit(){p("There is no code to submit. Find the right file and the door opens automatically.","w")},
hint(){p("HINT: "+L[lvl].hint,"w")},
restart(){start(0)},skip(){start(Math.min(lvl+1,L.length-1))},
clear(){out.textContent=""}};
function completeLevel(){clearInterval(timer);timer=null;tr.textContent="";p("","d");p("── DOOR UNLOCKED ──────────────────────────────","o");p("LESSON: "+L[lvl].lesson,"c");banner("ACCESS GRANTED","o");if(lvl+1<L.length){p("Advancing to next sector...","d");setTimeout(()=>start(lvl+1),2000)}else{p("All sectors cleared. You are a ghost.","c");try{localStorage.removeItem("nb_lvl")}catch(e){}p("Type restart to run it again.","d")}}
function tick(){tr.textContent="TRACE "+left+"s";tb.style.width=(100-left/S.tt*100)+"%";onyx.noise(1-left/S.tt);if(left--<=0)fail("Trace complete. You were locked out.")}
function run(v){v=v.trim();if(!v||busy)return;p(pr.textContent+" "+v,"d");const [c,...a]=v.split(/\s+/);if(C[c])C[c](...a);else p("Unknown command: "+c+" (type help)","b");if(S)prompt_()}
inp.addEventListener("keydown",e=>{if(e.key==="Enter"){run(inp.value);inp.value=""}});
document.getElementById("quick").innerHTML=["help","ls","pwd","scan","probe","porthack","disconnect","hint"].map(c=>'<button data-c="'+c+'">'+c+'</button>').join("");
document.getElementById("quick").onclick=e=>{const c=e.target.dataset.c;if(c)run(c)};
start(lvl);
</script></body></html>
