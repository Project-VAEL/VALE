<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PROJECT VALE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg-color: #030712;
    --glass-bg: rgba(15, 23, 42, 0.4);
    --glass-border: rgba(255, 255, 255, 0.08);
    --fg: #e2e8f0;
    --dim: #94a3b8;
    --acc: #38bdf8;
    --acc-glow: rgba(56, 189, 248, 0.4);
    --warn: #fbbf24;
    --bad: #f43f5e;
    --ok: #34d399;
    box-sizing: border-box;
}

html { height: 100%; }
* { box-sizing: border-box; }

body {
    margin: 0;
    height: 100%;
    background: radial-gradient(circle at 50% 0%, #1e293b 0%, var(--bg-color) 70%);
    color: var(--fg);
    font-family: "JetBrains Mono", monospace;
    font-size: 14px;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* Glassmorphism Containers */
#bar, #mission, #quick, #line {
    background: var(--glass-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--glass-border);
}

#bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    font-family: "Inter", sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--dim);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    z-index: 10;
}

#bar b {
    color: var(--acc);
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 4px;
    text-shadow: 0 0 15px var(--acc-glow);
    margin-right: 15px;
}

#trace {
    color: var(--warn);
    font-weight: 800;
    letter-spacing: 1px;
    text-shadow: 0 0 10px rgba(251, 191, 36, 0.4);
    animation: pulse-warn 2s infinite;
}

@keyframes pulse-warn {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
}

#tbw { height: 4px; background: rgba(0, 0, 0, 0.5); z-index: 10; }
#tb {
    height: 100%; width: 0;
    background: linear-gradient(90deg, var(--bad), #ff7a90);
    box-shadow: 0 0 12px var(--bad);
    transition: width 1s linear;
}

#mission {
    padding: 12px 20px;
    font-family: "Inter", sans-serif;
    font-size: 13px;
    color: var(--fg);
    cursor: pointer;
    border-bottom: 1px solid var(--glass-border);
    transition: background 0.3s;
}

#mission:hover { background: rgba(30, 41, 59, 0.6); }
#mission .t {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    color: var(--dim);
    margin-top: 6px;
    transition: all 0.3s ease;
}
#mission.open .t { display: block; color: var(--fg); }

.dots { margin-bottom: 4px; display: flex; gap: 6px; }
.dots span {
    display: block;
    width: 28px;
    height: 4px;
    background: #334155;
    border-radius: 4px;
    transition: 0.3s;
}
.dots .done { background: var(--ok); box-shadow: 0 0 8px rgba(52, 211, 153, 0.4); }
.dots .cur { background: var(--acc); box-shadow: 0 0 10px var(--acc-glow); }

#map {
    width: 100%;
    height: 200px;
    flex: none;
    background: radial-gradient(ellipse at center, rgba(15, 23, 42, 0.8) 0%, rgba(3, 7, 18, 0.95) 100%);
    border-bottom: 1px solid var(--glass-border);
    box-shadow: inset 0 -10px 20px rgba(0,0,0,0.5);
    z-index: 5;
}

.ln { stroke: #334155; stroke-width: 1.5; transition: stroke 0.3s; }
.ln.on { stroke: var(--acc); stroke-dasharray: 6 4; animation: flow 1s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -10; } }

.nd { fill: #0f172a; stroke: var(--dim); stroke-width: 2.5; transition: all 0.3s; cursor: crosshair; }
.nd.me { stroke: var(--acc); fill: rgba(56, 189, 248, 0.1); }
.nd.lk { stroke: var(--warn); }
.nd.on { stroke: var(--acc); animation: pulse-node 1.5s infinite; }
.nd.ok { stroke: var(--ok); fill: rgba(52, 211, 153, 0.1); }

@keyframes pulse-node {
    50% { stroke-width: 6; filter: drop-shadow(0 0 8px var(--acc)); }
}

.lb { fill: var(--fg); font: 700 11px "JetBrains Mono", monospace; text-anchor: middle; pointer-events: none; }
.st { fill: var(--dim); font: 10px "Inter", sans-serif; text-anchor: middle; pointer-events: none; }
.st.ok { fill: var(--ok); }

#out {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    white-space: pre-wrap;
    word-break: break-word;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    position: relative;
    z-index: 2;
}

.c { color: var(--acc); text-shadow: 0 0 8px var(--acc-glow); }
.d { color: var(--dim); }
.w { color: var(--warn); }
.b { color: var(--bad); text-shadow: 0 0 8px rgba(244, 63, 94, 0.4); }
.o { color: var(--ok); text-shadow: 0 0 8px rgba(52, 211, 153, 0.4); }

#quick {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 10px 20px;
    border-top: 1px solid var(--glass-border);
}

#quick button {
    flex: none;
    background: rgba(30, 41, 59, 0.5);
    color: var(--fg);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    padding: 8px 14px;
    font-family: "Inter", sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
}

#quick button:hover {
    background: var(--acc);
    color: #000;
    box-shadow: 0 0 12px var(--acc-glow);
    border-color: var(--acc);
    transform: translateY(-1px);
}

#line {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 20px;
    background: rgba(3, 7, 18, 0.8);
    border-top: 1px solid var(--glass-border);
}

#pr {
    color: var(--ok);
    font-weight: 700;
    white-space: nowrap;
    max-width: 45%;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 0 8px rgba(52, 211, 153, 0.3);
}

#in {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: 0;
    outline: 0;
    color: #fff;
    font-family: "JetBrains Mono", monospace;
    font-size: 16px;
    caret-color: var(--acc);
}

#line:focus-within {
    background: rgba(15, 23, 42, 0.9);
    border-top-color: var(--acc);
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.1) 0 1px, transparent 1px 3px);
    z-index: 100;
}

#bn {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    font: 800 48px "Inter", sans-serif;
    letter-spacing: 8px;
    pointer-events: none;
    background: rgba(3, 7, 18, 0.85);
    backdrop-filter: blur(8px);
    z-index: 200;
}

#bn.show { display: flex; animation: bo 2s forwards cubic-bezier(0.16, 1, 0.3, 1); }
@keyframes bo {
    0% { opacity: 0; transform: scale(0.9); }
    15% { opacity: 1; transform: scale(1); }
    80% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.05); }
}

#bn.o { color: var(--ok); text-shadow: 0 0 30px rgba(52, 211, 153, 0.6); }
#bn.b { color: var(--bad); text-shadow: 0 0 30px rgba(244, 63, 94, 0.6); }

/* ── Mission Briefing Overlay ── */
#briefing-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(3, 7, 18, 0.82);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 300;
    animation: brief-in 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

#briefing-overlay.hide {
    animation: brief-out 0.35s cubic-bezier(0.4, 0, 1, 1) forwards;
    pointer-events: none;
}

@keyframes brief-in {
    from { opacity: 0; }
    to   { opacity: 1; }
}
@keyframes brief-out {
    from { opacity: 1; }
    to   { opacity: 0; }
}

#briefing-box {
    width: min(640px, 92vw);
    background: rgba(10, 20, 40, 0.95);
    border: 1px solid rgba(56, 189, 248, 0.35);
    border-radius: 10px;
    box-shadow: 0 0 60px rgba(56, 189, 248, 0.12), 0 20px 60px rgba(0,0,0,0.7);
    padding: 36px 40px 32px;
    font-family: "JetBrains Mono", monospace;
    animation: box-in 0.45s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes box-in {
    from { opacity: 0; transform: translateY(18px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}

#briefing-box .br-eyebrow {
    font-family: "Inter", sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--acc);
    text-transform: uppercase;
    margin-bottom: 8px;
    opacity: 0.75;
}

#briefing-box .br-title {
    font-family: "Inter", sans-serif;
    font-size: 22px;
    font-weight: 800;
    color: #fff;
    letter-spacing: 1px;
    margin-bottom: 6px;
}

#briefing-box .br-diff {
    display: inline-block;
    font-family: "Inter", sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 3px 10px;
    border-radius: 4px;
    margin-bottom: 22px;
    background: rgba(56, 189, 248, 0.12);
    border: 1px solid rgba(56, 189, 248, 0.3);
    color: var(--acc);
}

#briefing-box .br-divider {
    height: 1px;
    background: rgba(255,255,255,0.07);
    margin-bottom: 22px;
}

#briefing-box .br-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2.5px;
    color: var(--dim);
    text-transform: uppercase;
    margin-bottom: 8px;
}

#briefing-box .br-objective {
    font-size: 14px;
    color: #e2e8f0;
    line-height: 1.7;
    margin-bottom: 20px;
    padding: 14px 16px;
    background: rgba(56, 189, 248, 0.05);
    border-left: 3px solid var(--acc);
    border-radius: 0 6px 6px 0;
}

#briefing-box .br-tips {
    font-size: 12px;
    color: var(--warn);
    line-height: 1.7;
    margin-bottom: 28px;
    opacity: 0.85;
}

#briefing-box .br-btn {
    display: block;
    width: 100%;
    padding: 14px;
    background: var(--acc);
    color: #000;
    border: none;
    border-radius: 6px;
    font-family: "Inter", sans-serif;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
}

#briefing-box .br-btn:hover {
    background: #7dd3fc;
    box-shadow: 0 0 30px rgba(56, 189, 248, 0.5);
    transform: translateY(-1px);
}

#briefing-box .br-skip {
    display: block;
    text-align: center;
    margin-top: 14px;
    font-family: "Inter", sans-serif;
    font-size: 12px;
    color: var(--dim);
    cursor: pointer;
    transition: color 0.2s;
    background: none;
    border: none;
    width: 100%;
}
#briefing-box .br-skip:hover { color: var(--fg); }

#bg { position: fixed; inset: 0; z-index: 1; opacity: 0.4; pointer-events: none; }
#out > div { animation: ln 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
@keyframes ln { from { opacity: 0; transform: translateY(8px); } }

</style>
</head>
<body>
<div id="bar"><span><b>PROJECT VALE</b> <span id="lv"></span></span><span id="trace"></span></div>
<div id="tbw"><div id="tb"></div></div>

<svg id="map" viewBox="0 0 400 170" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>

        <button class="br-btn" id="br-start">INITIATE SEQUENCE</button>
        <button class="br-skip" id="br-skip">Skip briefing</button>
    </div>
</div>

function initBg(){cv.width=innerWidth;cv.height=innerHeight;const w=cv.width,h=cv.height;cols=Array.from({length:Math.ceil(w/14)},()=>Math.random()*h/14);pts=Array.from({length:40},()=>({x:Math.random()*w,y:Math.random()*h,vx:Math.random()-.5,vy:Math.random()-.5}));rows=Array.from({length:Math.ceil(h/16)},()=>({o:Math.random()*400,s:.3+Math.random()*1.4,t:hx()}))}
function frame(){const w=cv.width,h=cv.height,m=bgm;tt+=.03;
if(m=="rain"||m=="alert"){cx.fillStyle="rgba(10,18,32,.12)";cx.fillRect(0,0,w,h);cx.fillStyle=bgc;cx.font="14px monospace";const C="01ABCDEF{}<>/#$%";cols.forEach((y,i)=>{cx.fillText(C[Math.random()*C.length|0],i*14,y*14);cols[i]=y*14>h&&Math.random()>.975?0:y+(m=="alert"?1.6:1)});if(m=="alert"&&Math.random()<.06){cx.fillStyle="rgba(255,60,80,.12)";cx.fillRect(0,Math.random()*h,w,4+Math.random()*14)}}
else{cx.fillStyle="rgba(10,18,32,.35)";cx.fillRect(0,0,w,h);cx.strokeStyle=bgc;cx.fillStyle=bgc;
if(m=="net"){pts.forEach(a=>{a.x=(a.x+a.vx+w)%w;a.y=(a.y+a.vy+h)%h;cx.fillRect(a.x,a.y,3,3);pts.forEach(b=>{const d=Math.hypot(a.x-b.x,a.y-b.y);if(d<110){cx.globalAlpha=1-d/110;cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke()}})});cx.globalAlpha=1}
if(m=="hex"){cx.font="12px monospace";cx.globalAlpha=.55;rows.forEach((r,i)=>{r.o=(r.o+r.s)%860;if(Math.random()<.01)r.t=hx();cx.fillText(r.t,-r.o,i*16+12);cx.fillText(r.t,860-r.o,i*16+12)});cx.globalAlpha=1}
if(m=="radar"){const X=w/2,Y=h*.45,R=Math.min(w,h)*.6;ang+=.03;for(let k=1;k<5;k++){cx.globalAlpha=.3;cx.beginPath();cx.arc(X,Y,R*k/4,0,7);cx.stroke()}for(let k=0;k<24;k++){cx.globalAlpha=(1-k/24)*.6;cx.beginPath();cx.moveTo(X,Y);cx.lineTo(X+Math.cos(ang-k*.03)*R,Y+Math.sin(ang-k*.03)*R);cx.stroke()}pts.forEach(p=>{const a=Math.atan2(p.y-Y,p.x-X),d=((ang-a)%6.283+6.283)%6.283;cx.globalAlpha=Math.max(0,1-d/3);cx.fillRect(p.x,p.y,5,5)});cx.globalAlpha=1}
if(m=="wave"){for(let j=0;j<4;j++){cx.globalAlpha=.6-j*.1;cx.beginPath();for(let x=0;x<=w;x+=6){const y=h*(.25+.17*j)+Math.sin(x*.012+tt*(1+j*.5))*(20+j*12)+Math.sin(x*.03-tt*2)*6;x?cx.lineTo(x,y):cx.moveTo(x,y)}cx.stroke()}cx.globalAlpha=1}}
if(!RM)requestAnimationFrame(frame)}
function setBg(a){bgm=a[0];bgc=a[1];document.documentElement.style.setProperty("--acc",a[1]);cx.clearRect(0,0,cv.width,cv.height)}
addEventListener("resize",initBg);initBg();frame();
function banner(t,c){bn.className="";void bn.offsetWidth;bn.textContent=t;bn.className="show "+c}
function drawMap(){const N=S.nodes,k=N.length;let s="";
const P=N.map((n,i)=>[k==1?290:190+i*130,k==1?85:(i?128:48)]);
P.forEach((q,i)=>{s+='<line x1="56" y1="85" x2="'+q[0]+'" y2="'+q[1]+'" class="ln'+(S.node===N[i]?" on":"")+'"/>'+(S.node===N[i]?'<circle r="3" fill="#fff"><animateMotion dur="1.1s" repeatCount="indefinite" path="M56,85 L'+q[0]+','+q[1]+'"/></circle>':"")});
s+='<circle cx="56" cy="85" r="17" class="nd me"/><text x="56" y="89" class="lb">YOU</text><text x="56" y="118" class="st ok">local</text>';
if(!k)s+='<text x="230" y="88" class="st">no network on this level</text>';
N.forEach((n,i)=>{const q=P[i],on=S.node===n,lk=n.ports||n.user||n.fw;
const st=!on?(lk?"locked":"open"):n.fw&&!S.fw?"FIREWALL":n.ports&&!S.hacked?"PORTS CLOSED":n.user&&!S.auth?"LOGIN":"ACCESS";
const ok=on&&st==="ACCESS";
s+='<circle cx="'+q[0]+'" cy="'+q[1]+'" r="15" class="nd '+(ok?"ok":on?"on":lk?"lk":"")+'"/><text x="'+q[0]+'" y="'+(q[1]+4)+'" class="lb">'+(ok?"✓":lk?"🔒":"●")+'</text><text x="'+q[0]+'" y="'+(q[1]+30)+'" class="lb">'+n.ip+'</text><text x="'+q[0]+'" y="'+(q[1]+41)+'" class="st '+(ok?"ok":"")+'">'+(on?st:n.name)+'</text>'});
mp.innerHTML=s;if(!timer)tb.style.width="0"}
try{lvl=Math.min(+localStorage.getItem("nb_lvl")||0,L.length-1)}catch(e){}
function p(s,c){const d=document.createElement("div");if(c)d.className=c;d.textContent=s;out.appendChild(d);out.scrollTop=out.scrollHeight}
function start(i){clearInterval(timer);tr.textContent="";lvl=i;try{localStorage.setItem("nb_lvl",i)}catch(e){}
const l=L[i];S={node:null,cwd:[],probed:0,fw:0,hacked:0,auth:0,cleaned:0,fs:JSON.parse(JSON.stringify(l.fs)),nodes:JSON.parse(JSON.stringify(l.nodes))};
lv.textContent=l.d+" · "+l.t;setBg(l.bg);busy=0;timer=null;
ms.innerHTML='<div class="dots">'+L.map((_,j)=>'<span class="'+(j<i?"done":j==i?"cur":"")+'"></span>').join("")+'</div><div class="t"></div>';ms.lastChild.textContent="Level "+(i+1)+" mission: "+l.brief;out.textContent="";
p("=== LEVEL "+(i+1)+": "+l.t.toUpperCase()+" ===","c");p("» "+l.story,"d");p("MISSION: "+l.brief);p(l.tips,"w");p("Type help for all commands, hint if you are stuck.","d");prompt_()}
function prompt_(){drawMap();pr.textContent=(S.node?S.node.ip:"local")+":/"+S.cwd.join("/")+" $"}
function root(){return S.node?S.node.fs:S.fs}
function dirAt(path){let d=root();for(const k of path){if(typeof d!=="object"||!(k in d))return null;d=d[k]}return d}
function res(a){const parts=a.split("/").filter(Boolean);let w=a.startsWith("/")?[]:[...S.cwd];for(const x of parts){if(x===".")continue;if(x==="..")w.pop();else w.push(x)}return w}
function access(){if(!S.node)return true;const n=S.node;if(n.ports&&!S.hacked){p("Access denied. Ports are closed. Try probe then porthack.","b");return false}if(n.user&&!S.auth){p("Access denied. Login required: login <user> <pass>","b");return false}return true}
function fail(m){clearInterval(timer);timer=null;tr.textContent="";banner("TRACED","b");p(m,"b");p("Mission failed. Restarting level...","w");setTimeout(()=>start(lvl),1800)}
function leave(){const n=S.node;if(n&&n.clean&&S.auth&&!S.cleaned){S.node=null;return fail("The admin found your fingerprints in the logs. You were traced.")}clearInterval(timer);timer=null;tr.textContent="";S.node=null;S.cwd=[];S.probed=S.hacked=S.auth=S.fw=0;p("Disconnected.","d")}
const C={
help(){p("ls  cd <dir>  cat <file>  pwd  clear\nscan  connect <ip>  disconnect\nprobe  analyze  solve <word>  porthack\nlogin <user> <pass>  rm <file>  sniff\nsubmit <code>  hint  skip\n(Only unlocked commands are needed for each level.)","d")},
pwd(){p("/"+S.cwd.join("/"))},
ls(){if(!access())return;const d=dirAt(S.cwd);if(!d||!Object.keys(d).length)return p("(empty)","d");p(Object.keys(d).map(k=>typeof d[k]==="object"?k+"/":k).join("   "),"c")},
cd(a){if(!access())return;if(!a)return p("Usage: cd <dir>","w");const w=res(a),d=dirAt(w);if(d&&typeof d==="object"){S.cwd=w}else p("No such directory: "+a,"b")},
cat(a){if(!access())return;if(!a)return p("Usage: cat <file>","w");const w=res(a),f=w.pop(),d=dirAt(w);if(d&&typeof d[f]==="string")p(d[f]);else p("No such file: "+a,"b")},
rm(a){if(!access())return;if(!a)return p("Usage: rm <file>","w");const w=res(a),f=w.pop(),d=dirAt(w);if(d&&typeof d[f]==="string"){delete d[f];p("Deleted "+f,"o");if(S.node&&f==="access.log")S.cleaned=1}else p("No such file: "+a,"b")},
scan(){if(!S.nodes.length)return p("No remote machines on this network.","d");p("Known machines:","c");S.nodes.forEach(n=>p("  "+n.ip+"   "+n.name))},
connect(a){if(S.node)return p("Already connected. Use disconnect first.","w");const n=S.nodes.find(x=>x.ip===a);if(!n)return p("Unknown host. Use scan to list machines.","b");S.node=n;S.cwd=[];S.probed=S.hacked=S.auth=S.fw=0;p("Connected to "+n.name+" ("+n.ip+")","o");if(n.ports||n.user)p("This machine is protected. Try probe.","w")},
disconnect(){if(!S.node)return p("Not connected.","d");leave()},
probe(){const n=S.node;if(!n)return p("Connect to a machine first.","w");S.probed=1;p("Scanning "+n.ip+"...");p("Open ports blocking you: "+(S.hacked?0:n.ports));p("Firewall: "+(n.fw&&!S.fw?"ACTIVE":"none"));p("Login required: "+(n.user&&!S.auth?"yes":"no"))},
analyze(){const n=S.node;if(!n||!n.fw)return p("Nothing to analyze here.","w");if(!S.probed)return p("Probe first.","w");p("Firewall key (spelled backwards): "+[...n.fw].reverse().join(""),"w");p("Reverse it, then: solve <word>","d")},
solve(a){const n=S.node;if(!n||!n.fw)return p("No firewall here.","w");if((a||"").toUpperCase()===n.fw){S.fw=1;p("Firewall down.","o")}else p("Wrong key. Alarm level rising.","b")},
sniff(){const n=S.node;if(!n||!n.sniff)return p("Nothing worth sniffing here.","w");if(n.ports&&!S.hacked)return p("Open the ports first.","b");p("Capturing packets...","d");p("CAPTURED: "+n.sniff,"o")},
porthack(){const n=S.node;if(!n)return p("Connect to a machine first.","w");if(!S.probed)return p("Probe the target first so you know what blocks you.","w");if(!n.ports||S.hacked)return p("No closed ports to crack.","d");if(n.fw&&!S.fw)return p("Blocked by firewall. Use analyze and solve first.","b");busy=1;const d=document.createElement("div");d.className="c";out.appendChild(d);let k=0;const t=setInterval(()=>{k++;d.textContent="Cracking ports ["+"#".repeat(k)+".".repeat(10-k)+"] "+k*10+"%";out.scrollTop=out.scrollHeight;if(k>=10){clearInterval(t);if(!busy)return;busy=0;S.hacked=1;p("Ports open.","o");if(n.trace&&!timer){left=S.tt=n.trace;tick();timer=setInterval(tick,1000)}prompt_()}},130)},
login(a,b){const n=S.node;if(!n||!n.user)return p("No login needed here.","d");if(n.ports&&!S.hacked)return p("Open the ports first.","b");if(a===n.user&&b===n.pass){S.auth=1;p("Welcome, "+a+".","o")}else p("Invalid credentials.","b")},
submit(a){const l=L[lvl];if(S.node)return p("Disconnect first, then submit.","w");if(a!==l.code)return p("Incorrect code.","b");clearInterval(timer);p("CODE ACCEPTED. Level complete!","o");p("LESSON: "+L[lvl].lesson,"c");banner("ACCESS GRANTED","o");if(lvl+1<L.length){p("Loading next level...","d");setTimeout(()=>start(lvl+1),1500)}else{p("You finished every level. You now know the basic hacking workflow: navigate, scan, probe, crack, log in, extract, clean up.","c");try{localStorage.removeItem("nb_lvl")}catch(e){}p("Type restart to play again.","d")}},
hint(){p("HINT: "+L[lvl].hint,"w")},
restart(){start(0)},skip(){start(Math.min(lvl+1,L.length-1))},
clear(){out.textContent=""}};
function tick(){tr.textContent="TRACE "+left+"s";tb.style.width=(100-left/S.tt*100)+"%";if(left--<=0)fail("Trace complete. You were locked out.")}
function run(v){v=v.trim();if(!v||busy)return;p(pr.textContent+" "+v,"d");const [c,...a]=v.split(/\s+/);if(C[c])C[c](...a);else p("Unknown command: "+c+" (type help)","b");if(S)prompt_()}
inp.addEventListener("keydown",e=>{if(e.key==="Enter"){run(inp.value);inp.value=""}});
document.getElementById("quick").innerHTML=["help","ls","pwd","scan","probe","porthack","disconnect","hint"].map(c=>'<button data-c="'+c+'">'+c+'</button>').join("");
document.getElementById("quick").onclick=e=>{const c=e.target.dataset.c;if(c)run(c)};
start(lvl);
</script></body></html>
